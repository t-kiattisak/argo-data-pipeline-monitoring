apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: batch-data-extractor-cron
  namespace: data-engineering
  labels:
    tier: pipeline
    environment: production
spec:
  schedule: "0 1 * * *"  # Runs daily at 01:00 AM
  timezone: "Asia/Bangkok"
  concurrencyPolicy: "Forbid"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5

  workflowSpec:
    entrypoint: main-orchestrator
    onExit: global-observability-handler
    activeDeadlineSeconds: 3600  # 1 hour SLA timeout guard
    serviceAccountName: data-pipeline-sa

    templates:
      # --- Master Orchestrator ---
      - name: main-orchestrator
        steps:
          # Step 1: Execute Pure Data Pipeline
          - - name: run-batch-extractor
              templateRef:
                name: batch-extractor-template
                template: execute-pipeline
              arguments:
                parameters:
                  - name: export_date
                    value: "{{workflow.creationTimestamp.Y}}-{{workflow.creationTimestamp.m}}-{{workflow.creationTimestamp.d}}"
                  - name: retry_limit
                    value: "2"

      # --- Unified onExit Handler delegating to Cluster Observability Template ---
      - name: global-observability-handler
        steps:
          - - name: ship-observability-event
              templateRef:
                clusterScope: true
                name: argo-observability-collector
                template: publish-event
              arguments:
                parameters:
                  - name: service_name
                    value: "batch-data-extractor"
                  - name: workflow_name
                    value: "{{workflow.name}}"
                  - name: status
                    value: "{{workflow.status}}"
                  - name: duration
                    value: "{{workflow.duration}}"
                  - name: failures
                    value: "{{workflow.failures}}"
                  - name: export_date
                    value: "{{workflow.creationTimestamp.Y}}-{{workflow.creationTimestamp.m}}-{{workflow.creationTimestamp.d}}"
